[project]
name = "snowflake-utils"
version = "1.27.3"
description = ""
authors = [
    { name = "Eli Yarson", email = "eli.yarsonnabhan@remote.com" },
    { name = "Paolo Quadri", email = "paolo.quadri@remote.com" },
]
requires-python = ">=3.12,<4.0"
readme = "README.md"
dependencies = [
    "snowflake-connector-python[secure-local-storage]>=4.7.1",
    "pydantic-settings>=2.2.1,<3",
]

[project.optional-dependencies]
vcr = ["vcrpy~=9.2.0", "urllib3>=2"]

[project.entry-points.pytest11]
snowflake_utils_vcr = "snowflake_utils.testing.vcr.plugin"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "ruff>=0.11.2,<0.12",
    "snowflake-utils[vcr]",
]

[tool.uv]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

[tool.ruff]
lint.extend-select = ["I"]
